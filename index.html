<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deadeye Prototype (Experimental)</title>
<style>
  html,body{margin:0;height:100%;background:#120d09;color:#e8d9c0;font:13px/1.4 system-ui,sans-serif}
  #app{display:flex;height:100%}
  #stage{flex:1;min-width:0;position:relative}
  #stage canvas{display:block;width:100%;height:100%}
  #debug{width:330px;overflow:auto;background:#1c140d;border-left:1px solid #4a3622;padding:10px;box-sizing:border-box}
  #debug h3{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#d4a24c}
  #debug button{background:#3a2a18;color:#f1e3c8;border:1px solid #6b4d2b;border-radius:4px;padding:4px 7px;margin:2px 2px 2px 0;cursor:pointer;font-size:12px}
  #debug button:hover{background:#573b1f}
  #debug button:disabled{opacity:.4;cursor:default}
  #debug input,#debug select{background:#0f0a06;color:#f1e3c8;border:1px solid #6b4d2b;border-radius:4px;padding:3px;font-size:12px}
  #log{font:11px/1.35 ui-monospace,monospace;background:#0b0704;border:1px solid #3a2a18;height:180px;overflow:auto;padding:4px;white-space:pre-wrap}
  #stats{font:11px ui-monospace,monospace;white-space:pre-wrap;color:#9fd59f}
  #hud{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;justify-content:center;padding:10px;background:#0009}
  #hud button#spin{font-size:18px;padding:8px 28px;background:#b5472a;color:#fff;border:2px solid #f0b36a;border-radius:30px;cursor:pointer}
  #hud button#spin:disabled{opacity:.5}
  #hud span{font-weight:600}
  @media (max-width:800px){#app{flex-direction:column}#debug{width:auto;height:45%;border-left:0;border-top:1px solid #4a3622}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="hud"></div></div>
  <div id="debug"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
